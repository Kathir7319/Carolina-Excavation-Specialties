<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="iconShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="iconClayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B44C28" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="iconDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Hexagonal Contractor Shield -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#iconShieldGrad)" stroke="url(#iconAmberGrad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#iconDropShadow)" />
  
  <!-- Inner Inset -->
  <polygon points="50,10 86,29 86,71 50,90 14,71 14,29" fill="#080D1A" stroke="#334155" stroke-width="1.2" opacity="0.8" />

  <!-- Wake County Red Clay Ground Cut -->
  <path d="M14 65 Q 32 60, 50 63 T 86 60 L 86 71 L 50 90 L 14 71 Z" fill="url(#iconClayGrad)" opacity="0.95" />
  <path d="M14 70 L 50 89 L 86 70" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.7" />

  <!-- Carolina Pine Crest Silhouette -->
  <path d="M50 20 L54 28 L51 28 L56 36 L44 36 L49 28 L46 28 Z" fill="#22C55E" opacity="0.9" />

  <!-- Excavator Boom & Hydraulic Ram -->
  <path d="M24 58 L 38 34 L 46 38 L 34 62 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.2" />
  <path d="M31 52 L 47 43" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Heavy Excavator Digging Bucket -->
  <path d="M43 42 L 61 37 L 72 50 L 64 64 L 46 62 Z" fill="url(#iconAmberGrad)" stroke="#78350F" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Trenching Teeth -->
  <polygon points="72,50 80,53 74,55" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8" />
  <polygon points="70,55 78,59 71,61" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8" />
  <polygon points="66,61 73,66 67,67" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8" />

  <!-- Heavy Mechanical Rivets -->
  <circle cx="46" cy="38" r="2.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="61" cy="37" r="2.2" fill="#0F172A" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="46" cy="62" r="2" fill="#0F172A" stroke="#FFFFFF" stroke-width="1" />
</svg>
