<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B44C28" />
      <stop offset="100%" stop-color="#E05E32" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ICON BADGE (HEXAGONAL HEAVY-DUTY SHIELD) -->
  <g transform="translate(10, 8)" filter="url(#badgeShadow)">
    <!-- Outer Hexagon Border -->
    <polygon points="52,4 94,27 94,77 52,100 10,77 10,27" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Inner Inset Line -->
    <polygon points="52,9 89,30 89,74 52,95 15,74 15,30" fill="#0B0F19" stroke="#334155" stroke-width="1.2" opacity="0.8" />
    
    <!-- North Carolina Pines & Stratum Background -->
    <path d="M52 24 L56 32 L53 32 L58 40 L46 40 L51 32 L48 32 Z" fill="#22C55E" opacity="0.85" />
    <path d="M38 29 L41 35 L39 35 L43 42 L33 42 L37 35 L35 35 Z" fill="#15803D" opacity="0.7" />
    <path d="M66 29 L69 35 L67 35 L71 42 L61 42 L65 35 L63 35 Z" fill="#15803D" opacity="0.7" />

    <!-- Strata Earth / Red Clay Cut -->
    <path d="M16 68 Q 35 63, 52 66 T 88 62 L 88 74 L 52 94 L 16 74 Z" fill="url(#clayGrad)" opacity="0.9" />
    <path d="M16 74 L 52 94 L 88 74" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Heavy Excavator Arm & Bucket Graphic -->
    <!-- Boom / Arm -->
    <path d="M26 62 L 40 38 L 47 42 L 35 66 Z" fill="#CBD5E1" stroke="#0F172A" stroke-width="1.2" />
    <!-- Hydraulic Cylinder -->
    <path d="M33 55 L 49 46" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Excavator Heavy Bucket -->
    <path d="M44 45 L 62 40 L 73 54 L 66 68 L 48 66 Z" fill="url(#goldGrad)" stroke="#78350F" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Bucket Teeth (Trenching Cutters) -->
    <polygon points="73,54 81,56 75,59" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8" />
    <polygon points="71,60 79,63 73,65" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8" />
    <polygon points="67,65 74,70 68,71" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8" />

    <!-- Pivot Rivet Details -->
    <circle cx="47" cy="42" r="2.5" fill="#0F172A" stroke="#F8FAFC" stroke-width="1" />
    <circle cx="62" cy="40" r="2.2" fill="#0F172A" stroke="#F8FAFC" stroke-width="1" />
    <circle cx="48" cy="66" r="2" fill="#0F172A" stroke="#F8FAFC" stroke-width="1" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(122, 16)">
    <!-- Top badge: Raleigh & Wake County Native -->
    <g transform="translate(0, 0)">
      <rect x="0" y="2" width="220" height="15" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="10" cy="9.5" r="3.5" fill="#F59E0B" />
      <text x="20" y="12.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#FCD34D" letter-spacing="1.2">
        RALEIGH &amp; WAKE COUNTY, NC
      </text>
    </g>

    <!-- Main Wordmark: CAROLINA -->
    <text x="0" y="52" font-family="'Barlow Condensed', 'Cabinet Grotesk', system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      CAROLINA
    </text>

    <!-- Secondary Wordmark: EXCAVATION SPECIALTIES -->
    <text x="1" y="73" font-family="'Barlow Condensed', 'Cabinet Grotesk', system-ui, sans-serif" font-size="19" font-weight="800" fill="url(#goldGrad)" letter-spacing="3.8">
      EXCAVATION SPECIALTIES
    </text>

    <!-- Tagline: Septic Systems • Site Clearing • Precision Grading -->
    <g transform="translate(0, 83)">
      <text x="1" y="9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
        SEPTIC SYSTEMS  <tspan fill="#F59E0B">•</tspan>  SITE CLEARING  <tspan fill="#F59E0B">•</tspan>  PRECISION GRADING
      </text>
    </g>
  </g>

  <!-- BADGE ACCENT: LICENSED & INSURED CHECK -->
  <g transform="translate(420, 26)">
    <circle cx="34" cy="34" r="28" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M24 34 L31 41 L45 27" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="34" y="53" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="6.5" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">LICENSED</text>
  </g>
</svg>
